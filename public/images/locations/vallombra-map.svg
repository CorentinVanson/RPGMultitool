<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Plan de Vallombra</title>
  <desc id="desc">Carte illustrée du bourg fortifié de Vallombra, avec le Bastione à l'ouest, les remparts, les quartiers et dix lieux numérotés.</desc>
  <defs>
    <pattern id="ground" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#d8c49b"/>
      <path d="M0 25 Q10 19 20 25 T40 25" fill="none" stroke="#c7af80" stroke-width="2" opacity=".5"/>
    </pattern>
    <pattern id="water" width="46" height="30" patternUnits="userSpaceOnUse">
      <rect width="46" height="30" fill="#6d9da0"/>
      <path d="M2 8 Q12 2 22 8 T42 8 M-8 21 Q2 15 12 21 T32 21" fill="none" stroke="#a8ccbf" stroke-width="3" opacity=".65"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#392d22" flood-opacity=".25"/></filter>
    <style>
      .label { font: 700 20px Georgia, serif; fill: #342b22; text-anchor: middle; }
      .small { font: 600 15px Georgia, serif; fill: #493c2d; text-anchor: middle; }
      .legend-text { text-anchor: start; }
      .legend-title { font: 700 14px Georgia, serif; fill: #493c2d; text-anchor: start; }
      .legend-item { font: 600 12px Georgia, serif; fill: #493c2d; text-anchor: start; }
      .road-label { font: 600 10px Georgia, serif; fill: #493c2d; text-anchor: start; }
      .number { font: 700 20px Georgia, serif; fill: #fff8e8; text-anchor: middle; dominant-baseline: central; }
      .building { fill: #bd7950; stroke: #633f31; stroke-width: 3; }
      .road { fill: none; stroke: #b9905a; stroke-width: 38; stroke-linecap: round; }
      .road-line { fill: none; stroke: #ead4a9; stroke-width: 4; stroke-dasharray: 12 12; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#efe3c5"/>
  <rect x="0" y="0" width="1200" height="800" fill="url(#ground)"/>
  <path d="M0 130 C145 90 190 190 290 210 S470 250 535 370 S475 630 620 800 L0 800Z" fill="url(#water)" stroke="#4d777b" stroke-width="6"/>
  <text x="115" y="430" class="label" fill="#f3ead4" transform="rotate(-72 115 430)">BASTIONE</text>

  <path d="M570 800 C575 690 585 635 610 575 S650 480 700 425 S790 350 920 315" class="road"/>
  <path d="M570 800 C575 690 585 635 610 575 S650 480 700 425 S790 350 920 315" class="road-line"/>
  <path d="M1010 325 C1080 300 1120 280 1200 260" class="road"/>
  <path d="M1010 325 C1080 300 1120 280 1200 260" class="road-line"/>
  <text x="1110" y="300" class="road-label" transform="rotate(-12 1110 300)">route de Gratigna</text>
  <text x="540" y="735" class="small" transform="rotate(-68 540 735)">route de la Riarsa</text>

  <path d="M420 150 L1030 150 L1080 215 L1080 570 L940 650 L530 650 L400 550 L400 230Z" fill="#caa875" stroke="#563e2e" stroke-width="18" filter="url(#shadow)"/>
  <path d="M440 170 L1012 170 L1058 225 L1058 550 L930 628 L545 628 L422 540 L422 240Z" fill="#e0c38f" stroke="#f3dca8" stroke-width="5"/>
  <path d="M425 375 L1058 375 M735 165 L735 625 M530 175 L530 370 M920 375 L920 625" stroke="#a27b51" stroke-width="7" opacity=".75"/>
  <path d="M485 300 L1015 300 M485 455 L1015 455" stroke="#c49a63" stroke-width="16" opacity=".65"/>

  <g class="building" filter="url(#shadow)"><rect x="450" y="205" width="125" height="80" rx="5"/><rect x="605" y="205" width="105" height="80" rx="5"/><rect x="735" y="205" width="120" height="80" rx="5"/></g>
  <g class="building" filter="url(#shadow)"><rect x="455" y="505" width="110" height="85" rx="5"/><rect x="595" y="505" width="120" height="85" rx="5"/><rect x="750" y="505" width="145" height="85" rx="5"/><rect x="920" y="505" width="120" height="85" rx="5"/></g>

  <g filter="url(#shadow)"><rect x="245" y="405" width="185" height="54" rx="4" fill="#9b6848" stroke="#563e2e" stroke-width="5"/><path d="M265 411V453 M290 411V453 M315 411V453 M340 411V453 M365 411V453 M390 411V453" stroke="#d2a06b" stroke-width="3" opacity=".8"/></g>
  <rect x="1009" y="275" width="100" height="60" rx="5" class="building" filter="url(#shadow)"/>
  <g fill="#805044" stroke="#4d332c" stroke-width="3"><circle cx="485" cy="245" r="19"/><circle cx="650" cy="245" r="19"/><circle cx="1059" cy="305" r="19"/><circle cx="795" cy="245" r="19"/><circle cx="980" cy="547" r="19"/><circle cx="735" cy="415" r="19"/><circle cx="330" cy="432" r="19"/><circle cx="505" cy="545" r="19"/><circle cx="655" cy="545" r="19"/><circle cx="820" cy="545" r="19"/></g>
  <g><text x="485" y="245" class="number">7</text><text x="650" y="245" class="number">4</text><text x="1059" y="305" class="number">1</text><text x="795" y="245" class="number">5</text><text x="980" y="547" class="number">6</text><text x="735" y="415" class="number">2</text><text x="330" y="432" class="number">9</text><text x="505" y="545" class="number">3</text><text x="655" y="545" class="number">10</text><text x="820" y="545" class="number">8</text></g>

  <text x="720" y="115" class="label">Vallombra</text>
  <text x="720" y="138" class="small">bourg fortifié des Marches de Gratigna</text>

  <g transform="translate(1080 65)"><path d="M0 42 L0 0 L-10 15 M0 0 L10 15" fill="none" stroke="#493c2d" stroke-width="4"/><text x="0" y="65" class="small">N</text></g>
  <g transform="translate(30 580)"><rect width="400" height="205" rx="8" fill="#f6ecd5" stroke="#72553b" stroke-width="3"/><text x="14" y="23" class="legend-title">Lieux de Vallombra</text><text x="14" y="49" class="legend-item">1. Porta Secca et corps de garde</text><text x="14" y="76" class="legend-item">2. Place du Marché</text><text x="14" y="103" class="legend-item">3. Maison du Conseil</text><text x="14" y="130" class="legend-item">4. Les Tinaie</text><text x="14" y="157" class="legend-item">5. La Piccola Curia</text><text x="210" y="76" class="legend-item">6. Maison des voyageurs</text><text x="210" y="103" class="legend-item">7. Les Hautes Maisons</text><text x="210" y="130" class="legend-item">8. Il Guscio</text><text x="210" y="157" class="legend-item">9. Quai du Bastione</text><text x="210" y="184" class="legend-item">10. Fosses et jardins bas</text></g>
  <text x="1030" y="744" class="small">Illustration de campagne</text>
</svg>
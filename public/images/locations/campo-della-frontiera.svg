<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Plan actuel du Campo della Frontiera</title>
  <desc id="desc">Ancien camp militaire réduit à une barricade en bois, un portail et plusieurs tentes autour d'une cour centrale.</desc>
  <defs>
    <pattern id="ground" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="34" height="34" fill="#d9c28f"/>
      <path d="M3 24 l8 -4 M19 10 l7 -3 M24 30 l6 -2" stroke="#b79b69" stroke-width="2" opacity=".55"/>
    </pattern>
    <pattern id="wood" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#765039"/>
      <path d="M3 0v24 M13 0v24" stroke="#a8784e" stroke-width="4" opacity=".65"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#392d22" flood-opacity=".28"/></filter>
    <style>
      .title { font: 700 28px Georgia, serif; fill: #35281d; text-anchor: middle; }
      .label { font: 600 18px Georgia, serif; fill: #493a2b; text-anchor: middle; }
      .small { font: 15px Georgia, serif; fill: #493a2b; }
    </style>
  </defs>
  <rect width="1000" height="650" fill="url(#ground)"/>
  <path d="M0 555 C220 520 380 590 560 548 S820 520 1000 550" fill="none" stroke="#b18d59" stroke-width="38"/>
  <path d="M0 555 C220 520 380 590 560 548 S820 520 1000 550" fill="none" stroke="#e7d09b" stroke-width="4" stroke-dasharray="14 14"/>
  <text x="500" y="620" class="label">route de Vallombra à Gratigna</text>

  <g filter="url(#shadow)">
    <rect x="180" y="105" width="640" height="400" rx="8" fill="#b69562" stroke="#503828" stroke-width="8"/>
    <rect x="205" y="130" width="590" height="350" fill="#d9bd82" stroke="#8e6745" stroke-width="3" stroke-dasharray="10 8"/>
  </g>

  <!-- Palissade basse et portail -->
  <path d="M180 105 H820 V505 H585 M415 505 H180 Z" fill="none" stroke="url(#wood)" stroke-width="28" stroke-linejoin="round"/>
  <path d="M180 105 H820 V505 H585 M415 505 H180 Z" fill="none" stroke="#432d21" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#976746" stroke="#432d21" stroke-width="3">
    <path d="M390 505 v-57 l18 -20 18 20 v57z"/><path d="M430 505 v-57 l18 -20 18 20 v57z"/>
  </g>
  <text x="430" y="545" class="label">portail en bois</text>

  <!-- Tentes -->
  <g fill="#b75f45" stroke="#673d32" stroke-width="4" filter="url(#shadow)">
    <path d="M275 210 L345 210 L370 285 L250 285 Z"/><path d="M535 190 L615 190 L645 280 L505 280 Z"/><path d="M665 330 L735 330 L760 420 L640 420 Z"/>
  </g>
  <g fill="#f0d49c" stroke="#673d32" stroke-width="3">
    <path d="M310 210 L310 285 M575 190 L575 280 M700 330 L700 420"/>
  </g>
  <text x="310" y="315" class="label">tente des PJ</text>
  <text x="575" y="310" class="label">tente-réserve</text>
  <text x="700" y="450" class="label">tente médicale</text>

  <!-- Cour et équipements abandonnés -->
  <ellipse cx="480" cy="370" rx="120" ry="70" fill="#c6a66d" stroke="#98754c" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="480" y="375" class="label">cour centrale</text>
  <g fill="#684832" stroke="#3f2b20" stroke-width="3"><rect x="275" y="365" width="70" height="42"/><rect x="390" y="165" width="85" height="35"/><rect x="515" y="410" width="85" height="35"/></g>
  <text x="310" y="430" class="small" text-anchor="middle">caisses</text>
  <text x="432" y="150" class="small" text-anchor="middle">feu éteint</text>
  <text x="557" y="470" class="small" text-anchor="middle">bois à trier</text>

  <text x="500" y="55" class="title">Campo della Frontiera</text>
  <text x="500" y="82" class="label">état initial — niveau de développement 0</text>
  <g transform="translate(850 75)"><path d="M0 35 V0 M0 0 L-9 14 M0 0 L9 14" stroke="#493a2b" stroke-width="4"/><text x="0" y="58" class="label">N</text></g>
  <g transform="translate(40 60)"><rect width="230" height="82" rx="7" fill="#f3e5c1" stroke="#77563d" stroke-width="3"/><text x="14" y="28" class="small">Palissade en bois</text><text x="14" y="50" class="small">Portail fonctionnel</text><text x="14" y="72" class="small">Trois tentes</text></g>
</svg>